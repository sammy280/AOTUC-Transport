name: aotuc_mobile
description: "Application Mobile Officielle AOTUC Guinée — Enrôlement Terrain & Contrôle Routier Hors-Ligne"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  cryptography: ^2.7.2
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo-guinee.png
